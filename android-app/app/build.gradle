plugins {
    id 'com.android.application'
    // ✅ REQUIRED: Apply Google Services plugin for Firebase
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.smartpetfeeder'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartpetfeeder"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.core:core:1.12.0'

    // ✅ Explicit — needed for ActivityResultLauncher used in MainActivity
    implementation 'androidx.activity:activity:1.8.2'

    // ✅ Explicit — needed for @NonNull/@Nullable annotations
    implementation 'androidx.annotation:annotation:1.7.1'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ✅ Firebase BOM — manages all Firebase library versions
    implementation platform('com.google.firebase:firebase-bom:32.7.4')

    // ✅ Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'

    // ✅ Firebase Realtime Database (chosen over Firestore for low-latency IoT sync)
    implementation 'com.google.firebase:firebase-database'

    // ✅ Firebase Cloud Messaging (FCM)
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
}
